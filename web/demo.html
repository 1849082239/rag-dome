<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG Demo</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; }
  #chat { border: 1px solid #ddd; border-radius: 8px; height: 420px; overflow-y: auto; padding: 16px; margin-bottom: 12px; }
  .q { text-align: right; margin: 8px 0; color: #1a73e8; }
  .a { margin: 8px 0; white-space: pre-wrap; }
  .src { font-size: 12px; color: #888; margin: 4px 0 12px; }
  #row { display: flex; gap: 8px; }
  #input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
  button { padding: 10px 20px; border: none; border-radius: 8px; background: #1a73e8; color: #fff; cursor: pointer; }
  button:disabled { background: #aaa; }
</style>
</head>
<body>
<h2>RAG 问答演示</h2>
<div id="chat"></div>
<div id="row">
  <input id="input" placeholder="比如：RAG 的完整流程包含哪几个步骤？" onkeydown="if(event.key==='Enter')ask()">
  <button id="btn" onclick="ask()">提问</button>
</div>
<script>
const API = 'http://localhost:8000';
async function ask() {
  const input = document.getElementById('input'), btn = document.getElementById('btn');
  const chat = document.getElementById('chat');
  const q = input.value.trim();
  if (!q) return;
  input.value = ''; btn.disabled = true;
  chat.innerHTML += `<div class="q">${q}</div>`;
  const aDiv = document.createElement('div'); aDiv.className = 'a'; chat.appendChild(aDiv);
  const srcDiv = document.createElement('div'); srcDiv.className = 'src'; chat.appendChild(srcDiv);

  const resp = await fetch(API + '/query/stream', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({question: q, top_k: 5})
  });
  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  while (true) {
    const {done, value} = await reader.read();
    if (done) break;
    buf += decoder.decode(value, {stream: true});
    const parts = buf.split('\n\n'); buf = parts.pop();
    for (const p of parts) {
      const line = p.trim();
      if (!line.startsWith('data:')) continue;
      const data = line.slice(5).trim();
      if (data === '[DONE]') continue;
      try {
        const obj = JSON.parse(data);
        if (obj.token) { aDiv.textContent += obj.token; }
        if (obj.sources) { srcDiv.textContent = '引用：' + obj.sources.map(s => `${s.source}(${s.score})`).join('、'); }
      } catch (e) { /* 忽略半包 */ }
    }
    chat.scrollTop = chat.scrollHeight;
  }
  btn.disabled = false;
}
</script>
</body>
</html>
