services:
  - type: web
    name: rag-demo
    runtime: python
    buildCommand: pip install --no-cache-dir -r requirements.txt && pip uninstall -y -q kubernetes onnxruntime tokenizers huggingface_hub hf_xet uvloop
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: LLM_BASE_URL
        value: http://jacob.hidencloud.com:24576/v1
      - key: LLM_CHAT_MODEL
        value: qwen3:1.7b
      - key: EMBEDDING_PROVIDER
        value: api
      - key: EMBED_BASE_URL
        value: http://jacob.hidencloud.com:24576/v1
      - key: LLM_EMBED_MODEL
        value: bge-m3
      - key: LLM_API_KEY
        value: ollama
      - key: VECTOR_STORE
        value: chroma
      - key: TOP_K
        value: 5
